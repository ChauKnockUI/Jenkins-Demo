version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:3000"
    networks:
      - app-network

  frontend:
    build: ./react-food-frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
